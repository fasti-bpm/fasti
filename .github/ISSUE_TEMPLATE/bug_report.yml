name: Bug report
description: Report a defect in Fasti BPM
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities: do **not** report them here, see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Fasti BPM version or image tag
      placeholder: 1.3.0
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: Distribution
      options:
        - Docker image
        - Run
        - Spring Boot starter
        - Tomcat
        - WildFly
        - Other
    validations:
      required: true
  - type: input
    id: database
    attributes:
      label: Database
      placeholder: PostgreSQL 16
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: As short as possible; attach the BPMN if needed
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove passwords and personal data before pasting
      render: text
  - type: dropdown
    id: upstream
    attributes:
      label: Does it happen on Camunda 7 CE 7.24.0?
      options:
        - Unknown
        - "Yes"
        - "No"
