name: Feature request
description: Suggest a change or a new feature
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the change you would like.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Fasti BPM do?
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility
      description: Does it affect compatibility with the Camunda 7 database, REST API or BPMN?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
