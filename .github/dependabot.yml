version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The engine follows Camunda 7 CE 7.24.0; those artifacts are not upgraded by bot.
      - dependency-name: "org.camunda.*"
      # Major upgrades of Java libraries (for example JUnit, Tomcat, test tooling) are done
      # by hand in a dedicated change with the full test suite; the bot proposes minor and
      # patch releases only.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /webapps/frontend-next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /distro/docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
