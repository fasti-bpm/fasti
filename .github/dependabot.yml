# Updates are grouped: at most one pull request per ecosystem and week, so that every
# change set runs the full CI once. Security updates are not grouped and arrive at once.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # The engine follows Camunda 7 CE 7.24.0; those artifacts are not upgraded by bot.
      - dependency-name: "org.camunda.*"
      # Major upgrades of Java libraries (for example JUnit, Tomcat, test tooling) are done
      # by hand in a dedicated change with the full test suite; the bot proposes minor and
      # patch releases only.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      maven-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /webapps/frontend-next
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web-ui:
        applies-to: version-updates
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /webapps/frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      classic-web-apps:
        applies-to: version-updates
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    # the workflows and the local composite actions they use
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /distro/docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
