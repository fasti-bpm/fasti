name: build

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs this workflow for a version tag and publishes only when it passes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Xmx3g

jobs:
  java:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the licence header check (part of the web UI build) compares with the 7.24.0 tag
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # The web UI unit tests run in the frontend job, so their Maven profile is off here.
      - name: Build and test
        run: ./mvnw -B -ntp -fae verify -P '!frontend-next-tests'

  frontend:
    name: Web UI (lint, typecheck, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: webapps/frontend-next
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the licence header check compares with the 7.24.0 tag
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # keep in line with version.nodejs.frontend.next in webapps/pom.xml
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: webapps/frontend-next/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:e2e
      - run: npm test

  e2e:
    name: End-to-end tests on the container image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the licence header check (part of the web UI build) compares with the 7.24.0 tag
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: webapps/frontend-next/package-lock.json
      - name: Build the distribution
        run: ./mvnw -B -ntp -pl distro/docker -am package -DskipTests
      - name: Build the image
        run: docker build -t fasti-bpm:ci --build-arg REVISION=${{ github.sha }} distro/docker/target/docker
      # Authentication stays on (the image default). The H2 demo database gets the
      # administrator the tests log in with; no secret is involved.
      - name: Start the container
        run: |
          docker run -d --name fasti -p 8080:8080 \
            -e FASTI_ADMIN_USER=demo -e FASTI_ADMIN_PASSWORD=demo fasti-bpm:ci --webapps --rest --example
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health/readiness; then exit 0; fi
            sleep 2
          done
          docker logs fasti
          exit 1
      - name: Install dependencies and Chromium
        working-directory: webapps/frontend-next
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the end-to-end tests
        working-directory: webapps/frontend-next
        env:
          E2E_BASE_URL: http://localhost:8080/fasti/
          E2E_USER: demo
          E2E_PASSWORD: demo
        run: npm run e2e
      - name: Container log
        if: failure()
        run: docker logs fasti
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-results
          path: webapps/frontend-next/target/e2e
          retention-days: 7
