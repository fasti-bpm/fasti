name: build

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs this workflow for a version tag and publishes only when it passes.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes. Every other run (main,
# release tags) has a group of its own, so none is cancelled or replaced while pending and
# the status of main reflects every commit.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Xmx3g
  # npm (directly and in the Maven build of the web UIs) retries failed registry requests
  # longer than its default of two retries within a minute
  npm_config_fetch_retries: '5'
  npm_config_fetch_retry_mintimeout: '20000'
  npm_config_fetch_retry_maxtimeout: '120000'

jobs:
  java:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the licence header check (part of the web UI build) compares with the 7.24.0 tag
          fetch-depth: 0
      - id: maven
        uses: ./.github/actions/setup-maven
        with:
          java-version: ${{ matrix.java }}
      # The web UI unit tests run in the frontend job, so their Maven profile is off here.
      - name: Build and test
        run: ./mvnw -B -ntp -fae verify -P '!frontend-next-tests'
      # Only main saves the local repository (once, from the Java 21 build, which resolves
      # the most); pull requests and the other jobs restore the newest entry of main.
      - name: Save the local Maven repository
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.java == '21'
          && steps.maven.outputs.repository-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven.outputs.repository-cache-key }}

  # The tests of the Quarkus extension are off in the build above (they need the profile
  # quarkus-tests). This job builds only the modules the extension needs and runs them.
  quarkus:
    name: Quarkus extension tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-maven
        with:
          java-version: '21'
      - name: Build the modules the extension needs
        run: >-
          ./mvnw -B -ntp install -DskipTests -am
          -pl quarkus-extension/engine/deployment,quarkus-extension/engine/qa
      - name: Run the Quarkus extension tests
        run: ./mvnw -B -ntp verify -Pquarkus-tests -f quarkus-extension/pom.xml

  frontend:
    name: Web UI (lint, typecheck, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: webapps/frontend-next
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the licence header check compares with the 7.24.0 tag
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # keep in line with version.nodejs.frontend.next in webapps/pom.xml
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: webapps/frontend-next/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:e2e
      - run: npm test

  e2e:
    name: End-to-end tests on the container image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the licence header check (part of the web UI build) compares with the 7.24.0 tag
          fetch-depth: 0
      - uses: ./.github/actions/setup-maven
        with:
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: webapps/frontend-next/package-lock.json
      - name: Build the distribution
        run: ./mvnw -B -ntp -pl distro/docker -am package -DskipTests
      - name: Build the image
        run: docker build -t fasti-bpm:ci --build-arg REVISION=${{ github.sha }} distro/docker/target/docker
      # Authentication stays on (the image default). The H2 demo database gets the
      # administrator the tests log in with; no secret is involved. Substitutes during
      # absence (off in the image) are turned on for their tests.
      - name: Start the container
        run: |
          docker run -d --name fasti -p 8080:8080 \
            -e FASTI_ADMIN_USER=demo -e FASTI_ADMIN_PASSWORD=demo -e FASTI_ABSENCE_ENABLED=true \
            fasti-bpm:ci --webapps --rest --example
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health/readiness; then exit 0; fi
            sleep 2
          done
          docker logs fasti
          exit 1
      - name: Install dependencies and Chromium
        working-directory: webapps/frontend-next
        run: |
          npm ci
          # the browser download and the system packages come from outside; retry them
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            echo "::warning::Installing Chromium failed (attempt ${attempt} of 3)"
            sleep $((attempt * 30))
          done
          exit 1
      - name: Run the end-to-end tests
        working-directory: webapps/frontend-next
        env:
          E2E_BASE_URL: http://localhost:8080/fasti/
          E2E_USER: demo
          E2E_PASSWORD: demo
        run: npm run e2e
      - name: Container log
        if: failure()
        run: docker logs fasti
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-results
          path: webapps/frontend-next/target/e2e
          retention-days: 7
