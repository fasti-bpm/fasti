name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          # AngularJS 1.8.x of the classic web apps (deprecated, off by default): every
          # release is affected and there is no fixed open-source release.
          allow-ghsas: GHSA-7x27-g8rg-x87w, GHSA-4w4v-5hc9-xrr2
