# Publishes the Maven artifacts of a version tag to Maven Central (manual start only).
# Runs the root POM profile "central": sources and javadoc jars, GPG signatures, and an upload
# through the Central Portal. The deployment is validated by the portal and then waits there
# for a manual "Publish" on https://central.sonatype.com/publishing, unless "auto-publish" is
# set. Setup and release steps: docs/publishing-maven-central.md.
#
# Repository secrets: MAVEN_CENTRAL_USERNAME and MAVEN_CENTRAL_PASSWORD (a Central Portal user
# token), MAVEN_GPG_PRIVATE_KEY (ASCII-armoured secret key) and MAVEN_GPG_PASSPHRASE. Without
# them the "publish" job is skipped with a notice. A dry run needs none of them: it builds the
# bundle (signed only if the key is set), keeps it as a workflow artifact and uploads nothing.
#
# The tests are not run here: the build workflow runs them for the tag (release.yml).
name: publish-maven

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish (for example v1.0.2)
        required: true
        type: string
      dry-run:
        description: Build and check the bundle only; do not upload it
        type: boolean
        default: false
      auto-publish:
        description: Publish right after the portal has validated the deployment (no manual step)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-maven
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      configured: ${{ steps.secrets.outputs.configured }}
      signing: ${{ steps.secrets.outputs.signing }}
    steps:
      - id: secrets
        name: Check the publishing secrets
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          signing=false
          if [ -n "$GPG_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            signing=true
          fi
          if [ -n "$CENTRAL_USERNAME" ] && [ -n "$CENTRAL_PASSWORD" ] && [ "$signing" = true ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The Maven Central secrets (MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, MAVEN_GPG_PRIVATE_KEY, MAVEN_GPG_PASSPHRASE) are not all set; nothing is published. See docs/publishing-maven-central.md."
          fi
          echo "signing=${signing}" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.configured == 'true' || inputs.dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      MAVEN_OPTS: -Xmx3g
      npm_config_fetch_retries: '5'
      npm_config_fetch_retry_mintimeout: '20000'
      npm_config_fetch_retry_maxtimeout: '120000'
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${TAG}' is not a release tag (vMAJOR.MINOR.PATCH)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          # the licence header check (part of the web UI build) compares with the 7.24.0 tag
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-maven
        with:
          java-version: '21'
      - name: Check that the POM version matches the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(./mvnw -B -q -N help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v${version}" != "$TAG" ]; then
            echo "::error::The POM version ${version} does not match the tag ${TAG}."
            exit 1
          fi
      - name: Import the signing key
        if: needs.check.outputs.signing == 'true'
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format long
      # setup-maven writes ~/.m2/settings.xml with the download mirror; this adds the server
      # entry of the Central Portal. The credentials stay in the environment of the Maven step.
      - name: Add the Central Portal server to the Maven settings
        run: |
          python3 - <<'EOF'
          import pathlib
          path = pathlib.Path.home() / '.m2' / 'settings.xml'
          server = ('  <servers>\n    <server>\n      <id>central</id>\n'
                    '      <username>${env.MAVEN_CENTRAL_USERNAME}</username>\n'
                    '      <password>${env.MAVEN_CENTRAL_PASSWORD}</password>\n'
                    '    </server>\n  </servers>\n')
          text = path.read_text()
          path.write_text(text.replace('</settings>', server + '</settings>', 1))
          EOF
      - name: Build, sign and upload to the Central Portal
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          DRY_RUN: ${{ inputs.dry-run }}
          AUTO_PUBLISH: ${{ inputs.auto-publish }}
          SIGNING: ${{ needs.check.outputs.signing }}
        run: |
          args=(-Pcentral -DskipTests "-Dcentral.autoPublish=${AUTO_PUBLISH}")
          if [ "$DRY_RUN" = true ]; then
            args+=(-Dcentral.skipUpload=true)
          fi
          if [ "$SIGNING" != true ]; then
            args+=(-Dgpg.skip)
          fi
          ./mvnw -B -ntp "${args[@]}" deploy
      - name: Keep the bundle of a dry run
        if: inputs.dry-run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: central-bundle
          path: target/central-publishing/central-bundle.zip
          retention-days: 3
