# Publishes the container image for a version tag. Before the first release set the
# repository variable DOCKERHUB_NAMESPACE and the secrets DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN. The image is built for amd64 and arm64, carries an SBOM and a provenance
# attestation, and is signed with cosign (keyless, GitHub OIDC).
#
# Jobs: "preflight" refuses a tag that is not a semantic version or that differs from the
# version of the POMs, before anything is built. "build" runs the full build workflow (Java
# build and tests, web UI checks, end-to-end tests on the image) for the tagged commit. "image"
# publishes and signs only after it has passed. "draft-release" attaches the SBOM to a draft
# GitHub release; it is the only job that may write repository contents.
#
# Image tags: X.Y.Z always; X.Y only for a release (not for a pre-release such as
# 1.1.0-rc.1); "latest" only when the tag is the highest release version of the repository, so
# a maintenance release of an older line (1.0.3 after 1.1.0) does not move it backwards.
name: release

on:
  push:
    # a glob, not a regular expression: "preflight" does the strict check
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check the tag
        run: |
          # semantic version with an optional pre-release; no build metadata ("+" is not
          # allowed in an image tag)
          id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-$id(\.$id)*)?$ ]]; then
            echo "::error::'${GITHUB_REF_NAME}' is not a release tag (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the POM version matches the tag
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as e; print(e.parse('pom.xml').getroot().findtext('{http://maven.apache.org/POM/4.0.0}version'))")
          if [ "v${version}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The POM version ${version} does not match the tag ${GITHUB_REF_NAME}. Set the version of the POMs first, then tag that commit."
            exit 1
          fi
      - name: Check the versions of the chart, the manifests and the Dockerfile
        run: bash distro/kubernetes/validate.sh --versions

  build:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  image:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # one image job at a time over all tags: "latest" is decided and pushed inside it, so two
    # releases that run at the same time cannot move it in the wrong order
    concurrency:
      group: release-image
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      DOCKERHUB_IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/fasti-bpm
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/fasti-bpm
    steps:
      - name: Check the release settings
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          if [ -z "$NAMESPACE" ]; then
            echo "::error::Set the repository variable DOCKERHUB_NAMESPACE before releasing."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the licence header check (part of the web UI build) compares with the 7.24.0 tag
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-maven
        with:
          java-version: '21'
      - name: Build the distribution
        run: ./mvnw -B -ntp -pl distro/docker -am package -DskipTests
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: latest
        name: Decide whether the image becomes "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=false
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # every tag of the repository, read here and not before the build: a newer release
            # may have been tagged meanwhile; a failed call fails the step
            refs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq '.[].ref')
            newest=$(echo "$refs" | sed 's|^refs/tags/||' | grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' | sort -V | tail -n 1)
            if [ "$newest" = "$GITHUB_REF_NAME" ]; then
              latest=true
            else
              echo "::notice::${GITHUB_REF_NAME} is not the highest release (${newest}): the image is not tagged latest."
            fi
          fi
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          # no automatic "latest": the step above decides (see the top of this file)
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.latest.outputs.latest == 'true' }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: distro/docker/target/docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${DOCKERHUB_IMAGE}@${DIGEST}"
          cosign sign --yes "${GHCR_IMAGE}@${DIGEST}"
      - uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: fasti-bpm.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: fasti-bpm.spdx.json
          retention-days: 7

  draft-release:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
      - name: Attach the SBOM to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
          gh release upload "$GITHUB_REF_NAME" fasti-bpm.spdx.json --clobber
