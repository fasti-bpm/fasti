# Configuration of the Fasti BPM container image.
#
# The entrypoint (docker-entrypoint.sh) passes the database settings and the FASTI_* options as
# Spring Boot properties, which override this file. Further YAML files can be mounted and named
# in FASTI_CONFIG; environment variables in Spring Boot notation (for example
# CAMUNDA_BPM_RUN_AUTH_ENABLED=true) work as well.
#
# The defaults here are chosen for connecting to a database that an existing installation
# already uses: nothing in it is created or changed unless asked for.

camunda.bpm:
  # secure by default (unlike Camunda Run): the REST API requires authentication and
  # authorization checks are on. Users, groups and authorizations come from the database, so an
  # existing Camunda 7 database keeps its logins. FASTI_INSECURE_DEMO=true is the only switch
  # back to the open demo mode (see README).
  authorization:
    enabled: true
  # Spin JSON/XML and Object variables are deserialized only into allow-listed types: the basic
  # Java types plus the packages and classes listed here, set with
  # FASTI_DESERIALIZATION_ALLOWED_PACKAGES / FASTI_DESERIALIZATION_ALLOWED_CLASSES (comma
  # separated). Without it, anyone who may write a variable could name any class on the class path.
  generic-properties.properties:
    deserialization-type-validation-enabled: true
  database:
    # never create or change tables of an existing database by default; the entrypoint switches
    # this on for the built-in H2 demo database or if FASTI_DB_SCHEMA_UPDATE=true
    schema-update: false
  # take the history level stored in the database; a new database gets FULL, like Run
  history-level: auto
  history-level-default: full
  job-execution:
    enabled: true
    # false, like Run and the former official container image: this node executes the jobs of
    # every deployment. Set FASTI_JOB_EXECUTOR_DEPLOYMENT_AWARE=true (or disable the job
    # executor) when other nodes run process applications whose classes this node lacks.
    deployment-aware: false
    # an acquisition fetches up to max-jobs-per-acquisition due jobs, the queue holds one
    # acquisition and max-pool-size threads execute them (docs/tuning-runtime.md). In Spring Boot
    # notation: CAMUNDA_BPM_JOB_EXECUTION_MAX_POOL_SIZE and so on. The core threads follow
    # max-pool-size unless CAMUNDA_BPM_JOB_EXECUTION_CORE_POOL_SIZE is set (never above it).
    core-pool-size: ${camunda.bpm.job-execution.max-pool-size:10}
    max-pool-size: 10
    queue-capacity: 10
    max-jobs-per-acquisition: 10
    # the exclusive jobs of one process instance acquired together run one after the other in
    # one thread under one lock of this length (5 minutes, as in Camunda 7.24): keep
    # max-jobs-per-acquisition x the slowest such job below it, or raise it
    # (CAMUNDA_BPM_JOB_EXECUTION_LOCK_TIME_IN_MILLIS); a lock that ran out lets another node
    # execute the job a second time
    lock-time-in-millis: 300000
  run:
    auth:
      enabled: true
    # cross-origin REST calls from browsers are off; FASTI_CORS_ALLOWED_ORIGINS enables them
    # ("*" restores what Run's default.yml and the former image allowed)
    cors:
      enabled: false
    deployment:
      deploy-changed-only: true
    example:
      enabled: false
  webapp:
    # no anonymous "create the first administrator" page: an empty database is bootstrapped
    # with FASTI_ADMIN_USER/FASTI_ADMIN_PASSWORD; FASTI_INITIAL_SETUP=true brings the page back
    initial-setup-enabled: false
    csrf:
      enable-same-site-cookie: true
      same-site-cookie-option: LAX

# refuse to start if the effective configuration (any file, variable or argument) turns REST
# authentication or authorization off; only FASTI_INSECURE_DEMO=true lifts this
fasti:
  security:
    enforce-auth: true
  # the image serves only the new web UI (/fasti/app/next/). The classic Cockpit, Tasklist,
  # Admin and Welcome are built on AngularJS 1.8.2 and Bootstrap 3, both end of life: their
  # pages redirect to the new web UI and their files are not served. FASTI_CLASSIC_WEBAPPS=true
  # brings them back (deprecated, logged as a warning).
  webapp:
    classic:
      enabled: false
  # substitutes during absence (docs/absence.md): off, as an existing installation may share the
  # database with Camunda 7.24 nodes; FASTI_ABSENCE_ENABLED=true turns it on (on every node)
  absence:
    enabled: false
  # four-eyes control for approvals (docs/four-eyes.md): on, as it only acts on user tasks whose
  # model declares a rule (fasti:fourEyes); FASTI_FOUR_EYES_ENABLED=false turns it off
  four-eyes:
    enabled: true
  # performance hints at start (docs/performance.md): one warning that lists the optional indexes of
  # /fasti/configuration/sql/optional/<database>_fasti_perf_indexes_create.sql that the database does
  # not have, and one for each setting that costs performance as the data grows. They only read;
  # FASTI_PERFORMANCE_INDEX_CHECK=off and FASTI_PERFORMANCE_CONFIG_CHECK=off silence them
  performance:
    index-check: warn
    config-check: warn
  # history cleanup runs only inside a batch window (or when started by hand). Example for a
  # mounted file named in FASTI_CONFIG, quoted so that YAML does not read 22:00 as a number; no
  # window is set here, as none fits every installation:
  #   camunda.bpm.generic-properties.properties:
  #     history-cleanup-batch-window-start-time: "22:00"
  #     history-cleanup-batch-window-end-time: "06:00"
  # immutable audit trail (docs/audit-trail.md): off, as it adds the tables FASTI_AUDIT_EVENT and
  # FASTI_AUDIT_HEAD and a write per command; FASTI_AUDIT_ENABLED=true turns it on (on every node).
  # With FASTI_DB_SCHEMA_UPDATE left off, create the tables first
  # (/fasti/configuration/sql/create/*_fasti_audit.sql).
  # The key that signs checkpoints: FASTI_AUDIT_HMAC_KEY or FASTI_AUDIT_HMAC_KEY_FILE (a secret).
  audit:
    enabled: false

# health, liveness and readiness below /actuator/health for HEALTHCHECK, Kubernetes probes and
# load balancers; nothing else of the actuator is exposed. Metrics, tracing and JSON logs are off;
# their switches (see docs/install-docker.md, "Observability"):
#   FASTI_METRICS_PROMETHEUS_ENABLED=true  /actuator/prometheus, with FASTI_METRICS_PROMETHEUS_TOKEN
#                                          (or _FILE) or a separate FASTI_MANAGEMENT_PORT
#   FASTI_TRACING_ENABLED=true             OpenTelemetry spans, sent to OTEL_EXPORTER_OTLP_ENDPOINT
#   FASTI_LOG_FORMAT=json                  one JSON object (Elastic Common Schema) per log line
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,processEngine

server:
  port: 8080
  # gzip for the web UI (scripts, styles, pages) and JSON answers of the REST API above 2 KB;
  # set server.compression.enabled=false when a reverse proxy already compresses
  compression:
    enabled: true
    min-response-size: 2KB
    mime-types: text/html,text/css,text/javascript,application/javascript,image/svg+xml,application/json,application/hal+json
  shutdown: graceful
  forward-headers-strategy: native

spring:
  # room for every job executor thread plus the requests that use the database at the same time
  # (HikariCP alone defaults to 10, as many as there are job threads). An idle node keeps 10
  # connections open and grows to 20 under load (unused ones close after 10 idle minutes).
  # DB_CONN_MAXACTIVE / DB_CONN_MINIDLE (or SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE /
  # _MINIMUM_IDLE) change them; the maxima of all nodes together, plus other clients, must stay
  # below the connection limit of the database.
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
  lifecycle:
    timeout-per-shutdown-phase: 30s
  web.resources:
    static-locations: NULL

logging:
  # everything goes to stdout; the container runtime collects it. With tracing on, a line written
  # inside a span carries "[<trace id>-<span id>] " before the logger; otherwise nothing is added
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%t] %replace([%X{traceId:-}-%X{spanId:-}] ){'^\\[-\\] ', ''}%logger{40} : %m%n"
