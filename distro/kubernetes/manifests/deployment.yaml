# Fasti BPM with an external PostgreSQL database, production mode. Environment variables of the
# image: distro/docker/README.md. Adapt DB_URL, the image tag (pin a digest) and the resources.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fasti
  namespace: fasti
  labels:
    app.kubernetes.io/name: fasti-bpm
    app.kubernetes.io/instance: fasti
spec:
  # several replicas share the database; web UI sessions are per pod (see the guide)
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: fasti-bpm
      app.kubernetes.io/instance: fasti
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fasti-bpm
        app.kubernetes.io/instance: fasti
    spec:
      serviceAccountName: fasti
      automountServiceAccountToken: false
      # no FASTI_PORT=tcp://... and similar variables for the Service "fasti": the entrypoint
      # reads FASTI_PORT as the HTTP port
      enableServiceLinks: false
      # SIGTERM: graceful shutdown with 30 s for running requests, after the preStop pause
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fasti
          # pin by digest in production: fastidev/fasti-bpm:1.2.0@sha256:...
          image: fastidev/fasti-bpm:1.2.0
          imagePullPolicy: IfNotPresent
          args: ["--webapps", "--rest", "--production"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DB_DRIVER
              value: org.postgresql.Driver
            - name: DB_URL
              value: jdbc:postgresql://postgres.db.svc.cluster.local:5432/fasti
            - name: DB_USERNAME_FILE
              value: /run/secrets/fasti/db-username
            - name: DB_PASSWORD_FILE
              value: /run/secrets/fasti/db-password
            - name: FASTI_WAIT_FOR
              value: postgres.db.svc.cluster.local:5432
            - name: FASTI_WAIT_FOR_TIMEOUT
              value: "60"
            # new, empty database: create the tables and the administrator. Remove these three
            # (and the fasti-admin source below) for the database of an existing installation.
            - name: FASTI_DB_SCHEMA_UPDATE
              value: "true"
            - name: FASTI_ADMIN_USER
              value: admin
            - name: FASTI_ADMIN_PASSWORD_FILE
              value: /run/secrets/fasti/admin-password
            # must be the same on every node that shares the database
            - name: TZ
              value: UTC
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              # includes the database connection and the process engine
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          # at least 2 CPUs and 2 GiB for real workloads; the heap is 75 % of the limit
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets/fasti
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /fasti/data
      volumes:
        - name: secrets
          projected:
            # readable by the group of the container user (fsGroup) only
            defaultMode: 0440
            sources:
              - secret:
                  name: fasti-db
                  items:
                    - key: username
                      path: db-username
                    - key: password
                      path: db-password
              - secret:
                  name: fasti-admin
                  items:
                    - key: password
                      path: admin-password
        # the only writable paths: temporary files of Tomcat and the JVM, and /fasti/data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: data
          emptyDir:
            sizeLimit: 256Mi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: fasti-bpm
                    app.kubernetes.io/instance: fasti
