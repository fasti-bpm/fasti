# Pod Security Standard "restricted": the Fasti pod runs as non-root with a read-only root
# file system and no capabilities.
apiVersion: v1
kind: Namespace
metadata:
  name: fasti
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
