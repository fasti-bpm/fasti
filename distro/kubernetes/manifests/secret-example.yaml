# Example only, not part of kustomization.yaml: never commit real passwords. Create the
# Secrets with kubectl instead, for example
#
#   kubectl -n fasti create secret generic fasti-db \
#     --from-literal=username=fasti --from-literal=password="$(openssl rand -hex 24)"
#   kubectl -n fasti create secret generic fasti-admin \
#     --from-literal=password="Fasti-1-$(openssl rand -hex 12)"
#
# or with a secret manager (External Secrets, Sealed Secrets, Vault). With --production the
# administrator password must have at least 10 characters with upper- and lowercase letters, a
# digit and a special character.
apiVersion: v1
kind: Secret
metadata:
  name: fasti-db
  namespace: fasti
type: Opaque
stringData:
  username: fasti
  password: REPLACE-WITH-THE-DATABASE-PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: fasti-admin
  namespace: fasti
type: Opaque
stringData:
  password: REPLACE-WITH-THE-ADMIN-PASSWORD
