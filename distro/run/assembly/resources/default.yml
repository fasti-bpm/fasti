# Find more available configuration properties on the following pages of the documentation.
# https://docs.camunda.org/manual/latest/user-guide/camunda-bpm-run/#configure-camunda-bpm-run
# https://docs.camunda.org/manual/latest/user-guide/spring-boot-integration/configuration/#camunda-engine-properties

camunda.bpm:
  admin-user:
    id: demo
    password: demo
  filter:
    create: All tasks
  run:
# https://docs.camunda.org/manual/latest/user-guide/camunda-bpm-run/#cross-origin-resource-sharing
    cors:
      enabled: true
      allowed-origins: "*"
    rest:
      disable-wadl: false
    deployment:
      deploy-changed-only: true
# https://docs.camunda.org/manual/latest/user-guide/camunda-bpm-run/#example-application
    example:
      enabled: true
# The web applications are served below /fasti; requests for the former path /camunda
# are redirected there (fasti.webapp.legacy-path-redirect: false turns that off).
# Uncomment to serve them below /camunda again, without redirect:
#  webapp:
#    application-path: /camunda

# Embedded HTML forms run in a sandboxed frame without a session (default); the web UI
# performs only the REST calls of their own task or start event for them. Alternatives:
# separate-origin (with fasti.webapp.forms-origin) and same-origin (forms can act with the
# session of the user; only if every process deployer is trusted).
#fasti.webapp:
#  forms-isolation: sandboxed
#  forms-origin: https://forms.example.com

# The classic Cockpit, Tasklist, Admin and Welcome (AngularJS 1.8.2 and Bootstrap 3, both end of
# life) are deprecated. Uncomment to serve only the new web UI, as the container image does;
# pages of the classic applications then redirect to the new web UI:
#fasti.webapp.classic.enabled: false

# Bearer tokens (JWT access tokens of an OpenID Connect provider) on the REST API. When enabled,
# every REST request needs a valid token (401 otherwise); the user, groups and tenants of the
# token become the engine identity. Basic authentication keeps working only together with
# camunda.bpm.run.auth.enabled: true.
#fasti.security.oidc:
#  rest:
#    bearer-enabled: true
#    issuer-uri: https://idp.example.com/realms/fasti
#    audiences: fasti-rest
#    jwk-set-uri: https://idp.example.com/realms/fasti/protocol/openid-connect/certs  # optional
#    jws-algorithms: RS256
#    user-id-claim: sub
#    groups-claim: groups
#  tenants:
#    claim: tenants

# Observability, all off by default. JSON logs: text (default), json (Elastic Common Schema),
# logstash or gelf. Prometheus metrics at /actuator/prometheus need a scrape token
# (Authorization: Bearer <token>) or a separate management.server.port. Tracing sends
# OpenTelemetry spans over OTLP/HTTP once an endpoint is set.
#fasti.logging.format: json
#fasti.metrics.prometheus:
#  enabled: true
#  token: change-me
#fasti.tracing.enabled: true
#management.opentelemetry.tracing.export.otlp.endpoint: http://localhost:4318/v1/traces

# datasource configuration is required
spring.datasource:
  url: jdbc:h2:./camunda-h2-default/process-engine;TRACE_LEVEL_FILE=0;DB_CLOSE_ON_EXIT=FALSE
  driver-class-name: org.h2.Driver
  username: sa
  password: sa

# By default, Spring Boot serves static content from any directories called /static or /public or /resources or
# /META-INF/resources in the classpath. To prevent users from accidentally sharing files, this is disabled here by setting static locations to NULL.
# https://docs.spring.io/spring-boot/docs/current/reference/htmlsingle/#boot-features-spring-mvc-static-content
spring.web.resources:
  static-locations: NULL