# This configuration is intended for production use and was created with respect to the security guide.
# The provided links to documentation guides for each property will give more information about the purpose of each property.
# security guide: https://docs.camunda.org/manual/latest/user-guide/security/

camunda.bpm:
# https://docs.camunda.org/manual/latest/user-guide/security/#http-header-security-in-webapps
# https://docs.camunda.org/manual/latest/webapps/shared-options/header-security/
  webapp:
# the filter that adds SameSite to the session cookie finds it by this name
    session-cookie:
      cookie-name: ${server.servlet.session.cookie.name:FASTI_SESSION}
# The web applications are served below /fasti; /camunda is redirected there.
# Uncomment to serve them below /camunda again, without redirect:
#    application-path: /camunda
    csrf:
      enable-same-site-cookie: true
      same-site-cookie-option: STRICT
    header-security:
      hsts-disabled: false

# https://docs.camunda.org/manual/latest/user-guide/security/#authorization
# https://docs.camunda.org/manual/latest/user-guide/process-engine/authorization-service/
  authorization.enabled: true

  generic-properties.properties:
# https://docs.camunda.org/manual/latest/user-guide/security/#variable-values-from-untrusted-sources
    deserialization-type-validation-enabled: true
    deserialization-allowed-packages:
    deserialization-allowed-classes:
# https://docs.camunda.org/manual/latest/user-guide/security/#password-policy
# https://docs.camunda.org/manual/latest/user-guide/process-engine/password-policy/
    enable-password-policy: true

  run:
# https://docs.camunda.org/manual/latest/user-guide/security/#authentication
# https://docs.camunda.org/manual/latest/user-guide/camunda-bpm-run/#authentication
    auth.enabled: true
    rest.disable-wadl: true
    deployment.deploy-changed-only: true
# https://docs.camunda.org/manual/latest/user-guide/process-engine/identity-service/#configuration-properties-of-the-ldap-plugin
# https://docs.camunda.org/manual/latest/user-guide/camunda-bpm-run/#ldap-identity-service
# Uncomment this section to enable LDAP support for Camunda Run
#    ldap:
#      enabled: true
#      server-url: ldaps://localhost:4334
#      administrator-group-name: camunda-admin
#      accept-untrusted-certificates: false
#      manager-dn: uid=jonny,ou=office-berlin,o=camunda,c=org
#      manager-password: s3cr3t
#      base-dn: o=camunda,c=org
#      user-search-base: ''
#      user-search-filter: (objectclass=person)
#      user-id-attribute: uid
#      user-firstname-attribute: cn
#      user-lastname-attribute: sn
#      user-email-ttribute: mail
#      user-password-attribute: userpassword
#      group-search-base: ''
#      group-search-filter: (objectclass=groupOfNames)
#      group-id-attribute: cn
#      group-name-attribute: cn
#      group-member-attribute: member
#      sort-control-supported: false
# https://docs.camunda.org/manual/latest/user-guide/process-engine/authorization-service/#the-administrator-authorization-plugin
# https://docs.camunda.org/manual/latest/user-guide/camunda-bpm-run/#ldap-administrator-authorization
# Uncomment this section to grant administrator authorizations to an existing LDAP user or group
#    admin-auth:
#      enabled: true
#      administrator-user-name: admin
#      administrator-group-name: admins

server:
# https://docs.camunda.org/manual/latest/user-guide/camunda-bpm-run/#https
# do not use the provided certificate in production
  ssl:
    key-store: classpath:keystore.p12
    key-store-password: camunda
    key-store-type: pkcs12
    key-alias: camunda
    key-password: camunda
  port: 8443

# https://docs.camunda.org/manual/latest/user-guide/security/#http-header-security-in-webapps
# https://docs.camunda.org/manual/latest/webapps/shared-options/header-security/
  servlet.session.cookie:
    secure: true
    http-only: true
    # a name of its own: browsers send cookies to every port of a host, so with the usual
    # JSESSIONID and Path=/ another application on the same host (for example Camunda 7 Run on
    # another port) would replace it and sign the user out
    name: FASTI_SESSION

# Responses above 2 KB (web UI scripts, styles, pages, JSON of the REST API) are compressed;
# set server.compression.enabled: false when a reverse proxy already compresses.
  compression:
    enabled: true
    min-response-size: 2KB
    mime-types: text/html,text/css,text/javascript,application/javascript,image/svg+xml,application/json,application/hal+json,application/xml,text/xml

# Up to 100 request threads (Tomcat's default is 200): the connection pool has room for about ten
# requests that use the database next to the job executor; more threads would only wait for a
# connection (docs/tuning-runtime.md)
  tomcat.threads.max: 100

# https://docs.camunda.org/manual/latest/user-guide/camunda-bpm-run/#logging
# https://docs.camunda.org/manual/latest/user-guide/logging/#process-engine
logging:
   level.root: INFO
   file.name: logs/camunda-bpm-run.log

# Observability, all off by default: JSON log lines (console and file), Prometheus metrics at
# /actuator/prometheus (scrape token required on this port; or serve the actuator on a
# management.server.port that only the monitoring network reaches), OpenTelemetry tracing over
# OTLP/HTTP. Lower the sampling probability (1.0 when tracing is on) for high request rates.
#fasti.logging.format: json
#fasti.metrics.prometheus:
#  enabled: true
#  token: ${FASTI_METRICS_TOKEN}
#fasti.tracing.enabled: true
#management:
#  opentelemetry.tracing.export.otlp.endpoint: https://otel-collector.example.com:4318/v1/traces
#  tracing.sampling.probability: 0.1

# Substitutes during absence (docs/absence.md), off by default. Turn it on for every node of a
# cluster at once; Camunda 7.24 nodes on the same database do not substitute.
#fasti.absence:
#  enabled: true
#  max-hops: 5
#  substitute-candidates: true

# Four-eyes control for approvals (docs/four-eyes.md), on: it only acts on user tasks whose model
# declares a rule (fasti:fourEyes), and a declared rule that is not enforced is the worse failure.
# Run it on every node of a cluster; Camunda 7.24 nodes on the same database do not enforce it.
fasti.four-eyes.enabled: true

# Performance hints at start (docs/performance.md): one warning that lists the optional indexes of
# configuration/sql/optional/<database>_fasti_perf_indexes_create.sql that the database does not
# have (a database administrator runs that script; safe next to Camunda 7.24 nodes), and one for
# each setting that costs performance as the data grows. They only read. To silence them:
#fasti.performance:
#  index-check: "off"
#  config-check: "off"
# History cleanup runs only inside a batch window (or when started by hand). Example, quoted so
# that YAML does not read 22:00 as a number; it stays commented out, as no window fits everyone:
#camunda.bpm.generic-properties.properties:
#  history-cleanup-batch-window-start-time: "22:00"
#  history-cleanup-batch-window-end-time: "06:00"

# Immutable audit trail (docs/audit-trail.md), off by default. Turn it on for every node of a
# cluster, give each node a stable node-id, keep the signing key outside the database (environment
# variable FASTI_AUDIT_HMAC_KEY or a file), and revoke UPDATE and DELETE on FASTI_AUDIT_EVENT from
# the database user of the application.
#fasti.audit:
#  enabled: true
#  node-id: node-1
#  hmac-key-file: /run/secrets/fasti-audit-key
#  retention-days: 3650

# Bearer tokens (JWT access tokens of an OpenID Connect provider) on the REST API. When enabled,
# every REST request needs a valid token (401 otherwise); the user, groups and tenants of the
# token become the engine identity. Basic authentication keeps working only together with
# camunda.bpm.run.auth.enabled: true.
#fasti.security.oidc:
#  rest:
#    bearer-enabled: true
#    issuer-uri: https://idp.example.com/realms/fasti
#    audiences: fasti-rest
#    jwk-set-uri: https://idp.example.com/realms/fasti/protocol/openid-connect/certs  # optional
#    jws-algorithms: RS256
#    user-id-claim: sub
#    groups-claim: groups
#  tenants:
#    claim: tenants

# datasource configuration is required
# do not use the H2 databse in production
# https://docs.camunda.org/manual/latest/user-guide/camunda-bpm-run/#connect-to-a-database
# https://docs.camunda.org/manual/latest/user-guide/camunda-bpm-run/#database
spring.datasource:
  url: jdbc:h2:./camunda-h2-test-production/process-engine;TRACE_LEVEL_FILE=0;DB_CLOSE_ON_EXIT=FALSE
  driver-class-name: org.h2.Driver
  username: sa
  password: sa
  hikari:
    maximum-pool-size: 20
    minimum-idle: 10
    # a request waits at most 10 s for a free connection (HikariCP's default is 30 s), so that an
    # exhausted pool or a database that does not answer shows as an error and in the readiness
    # check instead of tying up request threads
    connection-timeout: 10000

# Job executor and connection pool (docs/tuning-runtime.md). An acquisition fetches up to
# max-jobs-per-acquisition due jobs, the queue holds one acquisition, and max-pool-size threads
# execute them; the core threads follow max-pool-size unless core-pool-size is set (never above
# it). The connection pool has room for every job thread plus the requests that use the database
# at the same time: an idle node keeps minimum-idle connections open and grows to
# maximum-pool-size under load. With more job threads, raise maximum-pool-size by as many. The
# maxima of all nodes together, plus other clients, must stay below the connection limit of the
# database. The exclusive jobs of one process instance acquired together run one after the other
# in one thread under one lock of lock-time-in-millis (5 minutes, as in Camunda 7.24): keep
# max-jobs-per-acquisition x the slowest such job below it, or raise it; a lock that ran out lets
# another node execute the job a second time.
camunda.bpm.job-execution:
  core-pool-size: ${camunda.bpm.job-execution.max-pool-size:10}
  max-pool-size: 10
  queue-capacity: 10
  max-jobs-per-acquisition: 10
  lock-time-in-millis: 300000

# Limits worth setting on a large database or a cluster (docs/tuning-runtime.md); uncomment and
# adjust. Each line is a key of its own, so that they do not clash with the blocks above.
# Seconds after which the database cancels a statement: one runaway query cannot hold a
# connection and a request thread for good. Keep it above the slowest legitimate statement
# (reports, history cleanup, large deployments).
#camunda.bpm.generic-properties.properties.jdbc-statement-timeout: 60
# Most results one query of a signed-in user (REST API, web UI) may return. A list request
# without paging (no maxResults) then fails with "An unbound number of results is forbidden!":
# try the web UI and every REST client before turning it on.
#camunda.bpm.generic-properties.properties.query-max-results-limit: 10000
# Several nodes on one database: a node whose acquisition lost jobs to another one waits
# 50 ms before it acquires again, doubling up to 5 s while it keeps losing.
#camunda.bpm.job-execution.backoff-time-in-millis: 50
#camunda.bpm.job-execution.max-backoff: 5000

# By default, Spring Boot serves static content from any directories called /static or /public or /resources or
# /META-INF/resources in the classpath. To prevent users from accidentally sharing files, this is disabled here by setting static locations to NULL.
# https://docs.spring.io/spring-boot/docs/current/reference/htmlsingle/#boot-features-spring-mvc-static-content
spring.web.resources:
  static-locations: NULL